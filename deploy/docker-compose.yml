version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # API Gateway & Reverse Proxy
  # ----------------------------------------------------------------------------
  api-gateway:
    build:
      context: ../services/api-gateway
      dockerfile: Dockerfile
    container_name: sentinel-api-gateway
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - core-api
      - web-dashboard
      - report-generator
    networks:
      - sentinel-network

  # ----------------------------------------------------------------------------
  # Web Dashboard (React 18 + Vite + Tailwind CSS)
  # ----------------------------------------------------------------------------
  web-dashboard:
    build:
      context: ../apps/web-dashboard
      dockerfile: Dockerfile
    container_name: sentinel-web-dashboard
    restart: unless-stopped
    environment:
      - VITE_API_BASE_URL=http://localhost/api/v1
    networks:
      - sentinel-network

  # ----------------------------------------------------------------------------
  # Core API & Case Management Service (FastAPI + SQLAlchemy 2.0 Async)
  # ----------------------------------------------------------------------------
  core-api:
    build:
      context: ../services/core-api
      dockerfile: Dockerfile
    container_name: sentinel-core-api
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://sentinel_admin:sentinel_secure_password_2026@postgres-postgis:5432/lms_sentinel
      - DATABASE_SYNC_URL=postgresql://sentinel_admin:sentinel_secure_password_2026@postgres-postgis:5432/lms_sentinel
      - CELERY_BROKER_URL=redis://:sentinel_redis_pass_2026@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:sentinel_redis_pass_2026@redis:6379/1
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ROOT_USER=sentinel_minio_admin
      - MINIO_ROOT_PASSWORD=sentinel_minio_secret_key_2026
      - MINIO_PUBLIC_URL=http://localhost:9000
      - REPORT_GENERATOR_URL=http://report-generator:8002
    volumes:
      - ../rules:/app/rules:ro
    depends_on:
      postgres-postgis:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - sentinel-network

  # ----------------------------------------------------------------------------
  # AI Inference Pipeline (Celery Worker + YOLOv8 + PaddleOCR + spaCy)
  # ----------------------------------------------------------------------------
  ai-worker-gpu:
    build:
      context: ../services/ai-inference
      dockerfile: Dockerfile
    container_name: sentinel-ai-worker
    restart: unless-stopped
    environment:
      - CELERY_BROKER_URL=redis://:sentinel_redis_pass_2026@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:sentinel_redis_pass_2026@redis:6379/1
      - DATABASE_SYNC_URL=postgresql://sentinel_admin:sentinel_secure_password_2026@postgres-postgis:5432/lms_sentinel
      - RULES_JSON_PATH=/app/rules/lm_rules_2011.json
    volumes:
      - ../rules:/app/rules:ro
    depends_on:
      - redis
      - postgres-postgis
    networks:
      - sentinel-network

  # ----------------------------------------------------------------------------
  # Report & Notice Generator (WeasyPrint + PKI Digital Signing)
  # ----------------------------------------------------------------------------
  report-generator:
    build:
      context: ../services/report-generator
      dockerfile: Dockerfile
    container_name: sentinel-report-generator
    restart: unless-stopped
    environment:
      - PKI_SIGNER_NAME=Director of Legal Metrology, DOCA, Govt of India
      - PKI_SIGNER_LOCATION=New Delhi, India
    networks:
      - sentinel-network

  # ----------------------------------------------------------------------------
  # Relational Spatial Database (PostgreSQL 16 + PostGIS)
  # ----------------------------------------------------------------------------
  postgres-postgis:
    image: postgis/postgis:16-3.4
    container_name: sentinel-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=lms_sentinel
      - POSTGRES_USER=sentinel_admin
      - POSTGRES_PASSWORD=sentinel_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel_admin -d lms_sentinel"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sentinel-network

  # ----------------------------------------------------------------------------
  # Message Broker & Cache (Redis 7)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: sentinel-redis
    restart: unless-stopped
    command: redis-server --requirepass sentinel_redis_pass_2026
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "sentinel_redis_pass_2026", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sentinel-network

  # ----------------------------------------------------------------------------
  # Object Storage (MinIO S3 Compatible)
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-03-15T01-07-19Z
    container_name: sentinel-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=sentinel_minio_admin
      - MINIO_ROOT_PASSWORD=sentinel_minio_secret_key_2026
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sentinel-network

  # ----------------------------------------------------------------------------
  # Analytics Search Engine (Elasticsearch 8)
  # ----------------------------------------------------------------------------
  elasticsearch:
    image: elasticsearch:8.12.2
    container_name: sentinel-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - sentinel-network

  # ----------------------------------------------------------------------------
  # Identity & Access Management (Keycloak 24)
  # ----------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: sentinel-keycloak
    restart: unless-stopped
    command: start-dev
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin_secure_keycloak_2026
    ports:
      - "8080:8080"
    networks:
      - sentinel-network

networks:
  sentinel-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  es_data:
