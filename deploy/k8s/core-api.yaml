apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-core-api
  namespace: lms-sentinel
  labels:
    app: sentinel-core-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sentinel-core-api
  template:
    metadata:
      labels:
        app: sentinel-core-api
    spec:
      containers:
        - name: core-api
          image: lms-sentinel/core-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: sentinel-config
            - secretRef:
                name: sentinel-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: core-api
  namespace: lms-sentinel
spec:
  type: ClusterIP
  selector:
    app: sentinel-core-api
  ports:
    - port: 8000
      targetPort: 8000
