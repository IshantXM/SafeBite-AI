user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Rate limiting: 100 requests/min for inspection ingest, 300 req/min for general API
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=300r/m;
    limit_req_zone $binary_remote_addr zone=ingest_limit:10m rate=100r/m;

    # Max upload body size for high-resolution packaging photography
    client_max_body_size 50M;

    upstream core_api_backend {
        server core-api:8000;
    }

    upstream report_gen_backend {
        server report-generator:8002;
    }

    upstream web_dashboard_frontend {
        server web-dashboard:80;
    }

    server {
        listen 80;
        server_name localhost sentinel.consumeraffairs.gov.in;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # Inspection Ingest Rate Limited Route
        location /api/v1/inspections/ingest {
            limit_req zone=ingest_limit burst=20 nodelay;
            proxy_pass http://core_api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_read_timeout 120s;
        }

        # Core API Endpoints
        location /api/v1/ {
            limit_req zone=api_general burst=50 nodelay;
            proxy_pass http://core_api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Report Generator Direct Route
        location /api/v1/reports/ {
            proxy_pass http://report_gen_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        # API Docs
        location ~ ^/(docs|redoc|openapi.json) {
            proxy_pass http://core_api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Web Dashboard Static SPA
        location / {
            proxy_pass http://web_dashboard_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
